<style>
/* Layout: projector-first lab bench. Header with view tabs, one control strip, then a stage of

:root {

  --good: #15803d; --good-bg: #dbf1e2; --warn: #9a5b00; --warn-bg: #f7ebc6; --bad: #b91c1c; --bad-bg: #f8dcdc;
  --code-bg: #101820; --code-fg: #dbe3ea; --code-dim: #7f8d9b; --code-hl: #23384f; --code-m: #8db5ff; --code-n: #ffad7a;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --panel: #151b22; --fg: #e7ecf1; --muted: #9aa6b2; --line: #29323c; --line-strong: #64717e;

    --m: #78a8ff; --m-soft: #2f4e85; --m-faint: #1d2d4a;
    --n: #ff9c60; --n-soft: #7a3e1c; --n-faint: #3a2417;
    --good: #4ade80; --good-bg: #12301e; --warn: #f5c84b; --warn-bg: #362d0f; --bad: #f87171; --bad-bg: #3b1818;
    --code-bg: #0a0e13; --code-fg: #dbe3ea; --code-dim: #6c7986; --code-hl: #1e3149; --code-m: #8db5ff; --code-n: #ffad7a;
    --focus: #78a8ff;

}

  --bg: #0d1116; --panel: #151b22; --fg: #e7ecf1; --muted: #9aa6b2; --line: #29323c; --line-strong: #64717e;
  --cell: #1e262f;
  --m: #78a8ff; --m-soft: #2f4e85; --m-faint: #1d2d4a;
  --n: #ff9c60; --n-soft: #7a3e1c; --n-faint: #3a2417;
  --good: #4ade80; --good-bg: #12301e; --warn: #f5c84b; --warn-bg: #362d0f; --bad: #f87171; --bad-bg: #3b1818;
  --code-bg: #0a0e13; --code-fg: #dbe3ea; --code-dim: #6c7986; --code-hl: #1e3149; --code-m: #8db5ff; --code-n: #ffad7a;

}

  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

}

input[type="number"] { width: 5.5em; }
input[type="range"] { width: 180px; accent-color: var(--fg); }

.transport button.play[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.chip { font-family: var(--font-code); font-size: 0.8rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 4px 10px; cursor: pointer; }

.stage { display: grid; gap: 12px; align-items: start; }
.stage-mm { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr); }
.stage-wide { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .stage-mm { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stage-mm .code-card { grid-column: 1 / -1; } }
@media (max-width: 760px) { .stage-mm, .stage-wide { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { font-size: 1.1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
.card h2 small { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
.card h3 { font-size: 0.75rem; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; flex: none; }
.sw.m { background: var(--m); } .sw.n { background: var(--n); }
canvas { display: block; width: 100%; }
.cap { margin: 0; color: var(--muted); font-size: 0.85rem; }
.verdict { margin: 0; font-size: 1.15rem; font-weight: 700; text-wrap: balance; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

.txn { display: flex; flex-direction: column; gap: 6px; }
.txn-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.pill { font-weight: 700; font-size: 1.05rem; border-radius: 999px; padding: 2px 12px; font-variant-numeric: tabular-nums; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.idle { background: var(--cell); color: var(--muted); }
.txn-bytes { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.txn-rows { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
.txn-row { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); align-items: center; gap: 6px; }
.txn-lbl { font-family: var(--font-code); font-size: 0.68rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.txn-cells { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); gap: 1px; }
.txn-cells i { height: 9px; background: var(--c-soft); }
.txn-cells i.on { background: var(--c); }
.txn.m { --c: var(--m); --c-soft: var(--m-faint); }
.txn.n { --c: var(--n); --c-soft: var(--n-faint); }
.txn-empty { font-size: 0.9rem; color: var(--muted); margin: 0; }

.blockmap { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.blockmap canvas { width: 200px; max-width: 100%; cursor: pointer; touch-action: none; flex: none; }
.bm-side { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bm-side h3 { margin: 0; }
.bm-side p { margin: 0; }
.bm-warp { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bm-side kbd { font-family: var(--font-code); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--bg); }
.pseudo { display: flex; flex-direction: column; gap: 2px; font-size: 0.95rem; line-height: 1.45; }
.pseudo h3 { margin: 0 0 4px; }
.pseudo div { padding: 4px 10px; white-space: pre-wrap; border-left: 4px solid transparent; border-radius: 4px; color: var(--muted); }
.pseudo div.hl { background: var(--cell); border-left-color: var(--fg); color: var(--fg); font-weight: 700; }
.pseudo .m { color: var(--m); font-family: var(--font-code); font-size: 0.88rem; }
.pseudo .n { color: var(--n); font-family: var(--font-code); font-size: 0.88rem; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-family: var(--font-code); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-ui); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.m { color: var(--m); font-weight: 600; } td.n { color: var(--n); font-weight: 600; }
.totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tot .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.tot .v { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tot .s { font-size: 0.8rem; color: var(--muted); }
.takeaway { margin: 0; font-size: 0.95rem; border-left: 4px solid var(--fg); padding: 2px 0 2px 10px; }
.err { color: var(--bad); font-weight: 700; margin: 0; }
.lanegrid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; font-family: var(--font-code); font-size: 0.72rem; }
.lanegrid div { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; display: flex; justify-content: space-between; gap: 4px; font-variant-numeric: tabular-nums; }
.lanegrid b { color: var(--muted); font-weight: 400; }
footer { color: var(--muted); font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 4px 18px; }
footer kbd { font-family: var(--font-code); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--panel); }
@media (max-width: 600px) { .transport { margin-left: 0; } input[type="range"] { width: 120px; } }
</style>

<div class="app">
  <header>
    <div>
      <h1>Memory Coalescing Lab</h1>
      <p class="units">warp = 32 threads · float = 4 B · DRAM burst section = 128 B = 32 floats</p>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-view="primer"><kbd>1</kbd>DRAM bursts</button>
      <button class="tab" role="tab" data-view="naive"><kbd>2</kbd>Naive matmul</button>
      <button class="tab" role="tab" data-view="tiled"><kbd>3</kbd>Tiled matmul</button>
      <button class="tab" role="tab" data-view="sand"><kbd>4</kbd>Index sandbox</button>
    </nav>
  </header>
  <div class="controls" id="controls"></div>
  <main id="stage"></main>
  <footer>
    <span><kbd>←</kbd> <kbd>→</kbd> step</span>
    <span><kbd>Space</kbd> play or pause</span>
    <span><kbd>↑</kbd> <kbd>↓</kbd> switch warp (matmul views)</span>
    <span><kbd>1</kbd>–<kbd>4</kbd> switch view</span>
    <span>Each warp load is split into one DRAM request per 128-byte burst section it touches.</span>
  </footer>
</div>

<script>
const SEG = 32, WARP = 32, BYTES = 4, SEG_BYTES = 128;
const $ = s => document.querySelector(s);
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const S = {
  view: 'primer',
  primer: { p: 0 },
  naive: { W: 64, bd: 32, warp: 0, k: 0 },
  tiled: { W: 64, T: 32, warp: 0, s: 0 },
  sand: { expr: 'tx*W + k', W: 64, bd: 32, warp: 0, k: 0 },
};
let timer = null;

/* ---------- shared helpers ---------- */
function warpLanes(bdx, warp) {
  const out = [];
  for (let l = 0; l < WARP; l++) { const id = warp * WARP + l; out.push({ lane: l, tx: id % bdx, ty: Math.floor(id / bdx) }); }
  return out;
}
function analyze(idxs) {
  const segs = new Map();
  idxs.forEach((ix, l) => {
    if (ix == null) return;
    const s = Math.floor(ix / SEG), o = ix - s * SEG;
    if (!segs.has(s)) segs.set(s, new Map());
    const m = segs.get(s);
    if (!m.has(o)) m.set(o, []);
    m.get(o).push(l);
  });
  const ids = [...segs.keys()].sort((a, b) => a - b);
  let uniq = 0; segs.forEach(m => uniq += m.size);
  return { ids, segs, requests: ids.length, usedBytes: uniq * BYTES, fetchedBytes: ids.length * SEG_BYTES };
}
const hex = a => '0x' + a.toString(16).padStart(4, '0');
function pillClass(n) { return n === 0 ? 'idle' : n === 1 ? 'good' : n <= 4 ? 'warn' : 'bad'; }
function verdict(an) {
  if (an.requests === 0) return 'No DRAM traffic.';
  const eff = Math.round(100 * an.usedBytes / an.fetchedBytes);
  if (an.requests === 1 && an.usedBytes === SEG_BYTES) return 'Fully coalesced: one 128-byte request, every byte used.';
  if (an.requests === 1 && an.usedBytes === BYTES) return 'One request. Every lane reads the same word, so the value is broadcast.';
  if (an.requests === 1) return `Coalesced into one request, but only ${eff}% of the burst is used.`;
  return `Not coalesced: ${an.requests} requests for one load instruction, ${eff}% of fetched bytes used.`;
}
function renderTxn(el, an, opts = {}) {
  const n = an.requests;
  if (opts.idle) { el.innerHTML = `<div class="txn-head"><span class="pill idle">0 requests</span><span class="txn-bytes">${opts.idle}</span></div>`; return; }
  const eff = n ? Math.round(100 * an.usedBytes / an.fetchedBytes) : 0;
  let html = `<div class="txn-head"><span class="pill ${pillClass(n)}">${n} DRAM request${n === 1 ? '' : 's'}</span>` +
    `<span class="txn-bytes">${an.usedBytes} B used of ${an.fetchedBytes} B fetched · ${eff}%</span></div>`;
  if (opts.rows !== false && n) {
    html += '<div class="txn-rows">';
    for (const id of an.ids) {
      const m = an.segs.get(id);
      let cells = '';
      for (let o = 0; o < SEG; o++) cells += m.has(o) ? `<i class="on" title="lane ${m.get(o).join(', ')}"></i>` : '<i></i>';
      html += `<div class="txn-row"><span class="txn-lbl">${hex(id * SEG_BYTES)}</span><div class="txn-cells">${cells}</div></div>`;
    }
    html += '</div>';
  }
  el.innerHTML = html;
}
function setupCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

/* ---------- matrix canvas ---------- */
function drawMatrix(cv, W, o) {
  const w = cv.clientWidth;
  const axis = 18;
  const size = w - axis;
  const cell = size / W;
  const { ctx } = setupCanvas(cv, w);
  const col = tok(o.c), soft = tok(o.c + '-soft'), faint = tok(o.c + '-faint');
  const base = tok('--cell'), grid = tok('--line-strong'), fg = tok('--fg'), muted = tok('--muted');
  ctx.fillStyle = tok('--panel'); ctx.fillRect(0, 0, w, w);
  const fseg = new Set(o.fetched || []);
  for (let r = 0; r < W; r++) for (let c = 0; c < W; c++) {
    const idx = r * W + c, seg = Math.floor(idx / SEG);
    let f = base;
    if (o.cur && o.cur.has(idx)) f = col;
    else if (fseg.has(seg)) f = soft;
    else if (o.hist && o.hist.has(idx)) f = faint;
    ctx.fillStyle = f;
    ctx.fillRect(axis + c * cell, axis + r * cell, Math.max(cell - (cell > 5 ? 1 : 0), 0.6), Math.max(cell - (cell > 5 ? 1 : 0), 0.6));
  }
  // burst-section boundaries (every 32 floats in linear order)
  ctx.strokeStyle = grid; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let r = 0; r < W; r++) for (let c = 1; c < W; c++) if ((r * W + c) % SEG === 0) {
    const x = axis + c * cell - (cell > 5 ? 0.5 : 0);
    ctx.moveTo(x, axis + r * cell); ctx.lineTo(x, axis + (r + 1) * cell);
  }
  ctx.stroke();
  if (o.region) {
    const [r0, c0, h, ww] = o.region;
    ctx.setLineDash([5, 3]); ctx.strokeStyle = fg; ctx.lineWidth = 2;
    ctx.strokeRect(axis + c0 * cell - 1, axis + r0 * cell - 1, ww * cell + 1, h * cell + 1);
    ctx.setLineDash([]);
  }
  // axes ticks
  ctx.fillStyle = muted; ctx.font = '10px ' + tok('--font-code');
  ctx.textBaseline = 'middle';
  for (let t = 0; t <= W; t += 32) {
    const p = axis + t * cell;
    ctx.textAlign = t === W ? 'right' : 'left';
    ctx.fillText(String(t), Math.min(p, w - 1), axis / 2);
    ctx.save(); ctx.translate(axis / 2, Math.min(p, w - 2)); ctx.rotate(-Math.PI / 2); ctx.textAlign = t === W ? 'right' : 'left'; ctx.fillText(String(t), 0, 0); ctx.restore();
  }
}

/* ---------- warp-to-memory map ---------- */
function memRows(ids) {
  if (!ids.length) return [];
  const min = ids[0], max = ids[ids.length - 1], rows = [];
  if (max - min < 10) { for (let s = min; s <= max; s++) rows.push({ seg: s }); return rows; }
  ids.forEach((s, j) => { if (j > 0 && s - ids[j - 1] > 1) rows.push({ gap: s - ids[j - 1] - 1 }); rows.push({ seg: s }); });
  return rows;
}
function drawMemMap(cv, idxs, an, c = '--m') {
  const w = cv.clientWidth, L = 78, colW = (w - L - 4) / 32;
  const rows = memRows(an.ids);
  const nSeg = rows.filter(r => r.seg != null).length, nGap = rows.length - nSeg;
  const thH = 26, linesH = 64, gapH = 14;
  const rowH = Math.max(9, Math.min(26, Math.floor(440 / Math.max(nSeg, 1))));
  const h = thH + linesH + nSeg * rowH + nGap * gapH + 8;
  const { ctx } = setupCanvas(cv, h);
  const col = tok(c), soft = tok(c + '-soft'), faint = tok(c + '-faint'), base = tok('--cell'), muted = tok('--muted'), fg = tok('--fg');
  const code = tok('--font-code');
  ctx.fillStyle = tok('--panel'); ctx.fillRect(0, 0, w, h);
  ctx.textBaseline = 'middle';
  // thread boxes
  ctx.font = '700 11px ' + tok('--font-ui'); ctx.fillStyle = muted; ctx.textAlign = 'right';
  ctx.fillText('LANE', L - 8, thH / 2);
  ctx.font = '10px ' + code;
  for (let l = 0; l < 32; l++) {
    const x = L + l * colW;
    ctx.fillStyle = idxs[l] == null ? base : col; ctx.fillRect(x + 1, 0, colW - 2, thH);
    ctx.fillStyle = idxs[l] == null ? muted : tok('--panel'); ctx.textAlign = 'center';
    if (colW > 13 || l % 4 === 0) ctx.fillText(String(l), x + colW / 2, thH / 2);
  }
  // rows
  const rowTop = new Map(); let y = thH + linesH;
  for (const r of rows) {
    if (r.gap != null) {
      ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.font = '10px ' + code;
      ctx.fillText(`⋮ ${r.gap} section${r.gap === 1 ? '' : 's'} not touched`, L + 4, y + gapH / 2);
      y += gapH; continue;
    }
    rowTop.set(r.seg, y);
    const m = an.segs.get(r.seg);
    if (rowH >= 10) { ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.font = Math.min(11, rowH - 1) + 'px ' + code; ctx.fillText(hex(r.seg * SEG_BYTES), L - 8, y + rowH / 2); }
    for (let o = 0; o < 32; o++) {
      ctx.fillStyle = m ? (m.has(o) ? col : soft) : base;

    <div class="ctl"><label for="sBd">blockDim.x</label><select id="sBd">${[32, 16, 8, 4, 1].map(v => `<option ${v === st.bd ? 'selected' : ''}>${v}</option>`).join('')}</select></div>

    <div class="ctl"><label for="sK">k</label><input type="range" id="sK" min="0" max="${Math.max(st.W - 1, 0)}" value="${st.k}"></div>` + transport() +
    `<div class="chips" style="flex-basis:100%">${SAND_PRESETS.map(p => `<button class="chip" data-expr="${p}">${p}</button>`).join('')}</div>`;
}
function stageSand() {
  return `<div class="stage stage-wide">
    <section class="card"><h2><span class="sw m"></span>Addresses for one warp</h2><p class="cap">Names: <code>tx ty k W bdx Row Col</code>. <code>Row</code> = ty and <code>Col</code> = tx for block (0, 0). <code>A[r][c]</code> means <code>A[r*W + c]</code>. Division is C integer division.</p>
      <p class="err" id="sErr"></p><canvas id="mem"></canvas>
      <div class="legend"><span><i style="background:var(--m)"></i>word a lane asked for</span><span><i style="background:var(--m-soft)"></i>fetched in the same burst, unused</span></div></section>
    <section class="card"><h2>What DRAM sees</h2><p class="verdict" id="sVerdict"></p><div id="txn" class="txn m"></div>
      <h3>Lane → index</h3><div class="lanegrid" id="laneGrid"></div>
      <p class="takeaway">Rule of thumb from the slides: the load coalesces when the index has the form (terms without threadIdx.x) + threadIdx.x.</p></section></div>`;
}
function renderSand() {
  const st = S.sand;
  let f, err = '';
  try { f = compile(st.expr); } catch (e) { err = e.message; }
  let idxs = [];
  if (!err) {
    try {
      idxs = warpLanes(st.bd, st.warp).map(o => f({ tx: o.tx, ty: o.ty, k: st.k, W: st.W, bdx: st.bd, lane: o.lane, bx: 0 }));
      if (idxs.some(v => v < 0)) err = 'Some lanes compute a negative index.';
      else if (idxs.some(v => !Number.isFinite(v))) err = 'The index is not a finite number.';
    } catch (e) { err = e.message; }
  }
  $('#sErr').textContent = err; $('#sErr').hidden = !err;
  if (err) idxs = range32().map(() => null);
  const an = analyze(idxs);
  $('#sVerdict').textContent = err ? 'Fix the expression to see the access.' : verdict(an);
  renderTxn($('#txn'), an);
  drawMemMap($('#mem'), idxs, an);
  $('#laneGrid').innerHTML = idxs.map((v, l) => `<div><b>${l}</b><span>${v ?? '–'}</span></div>`).join('');
  setStepInfo(`k = ${st.k}`);
}

/* ---------- controls, stepping, wiring ---------- */
function transport() {
  return `<div class="transport"><button id="prev" aria-label="Previous step">◀</button><button id="play" class="play" aria-pressed="${!!timer}" aria-label="Play or pause">${timer ? 'Pause' : 'Play'}</button><button id="next" aria-label="Next step">▶</button><span class="stepinfo" id="stepinfo"></span></div>`;
}
function setStepInfo(t) { const e = $('#stepinfo'); if (e) e.textContent = t; }
const VIEWS = {
  primer: { ctl: ctlPrimer, stage: stagePrimer, render: renderPrimer, n: () => PRESETS.length, get: () => S.primer.p, set: v => S.primer.p = v },
  naive: { ctl: ctlNaive, stage: () => stageMM(), render: renderNaive, n: () => S.naive.W, get: () => S.naive.k, set: v => S.naive.k = v, slider: 'nK' },
  tiled: { ctl: ctlTiled, stage: () => stageMM(), render: renderTiled, n: () => 3 * S.tiled.W / S.tiled.T, get: () => S.tiled.s, set: v => S.tiled.s = v, slider: 'tS' },
  sand: { ctl: ctlSand, stage: stageSand, render: renderSand, n: () => Math.max(S.sand.W, 1), get: () => S.sand.k, set: v => S.sand.k = v, slider: 'sK' },
};
function render() { VIEWS[S.view].render(); if (S.view === 'naive' || S.view === 'tiled') drawBlockMap(); const sl = VIEWS[S.view].slider && $('#' + VIEWS[S.view].slider); if (sl) sl.value = VIEWS[S.view].get(); }
function buildControls() { $('#controls').innerHTML = VIEWS[S.view].ctl(); bindControls(); }
function switchView(v) {
  S.view = v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  try { localStorage.setItem('coalesce-view', v); } catch (e) {}
  $('#stage').innerHTML = VIEWS[v].stage();
  bindBlockMap(); buildControls(); render();
}
function step(d) { const V = VIEWS[S.view], n = V.n(); V.set((V.get() + d + n) % n); render(); }
function togglePlay() {
  if (timer) { clearInterval(timer); timer = null; } else timer = setInterval(() => step(1), S.view === 'primer' ? 2200 : 1100);
  const b = $('#play'); if (b) { b.setAttribute('aria-pressed', !!timer); b.textContent = timer ? 'Pause' : 'Play'; }
}
function stopPlay() { if (timer) togglePlay(); }
function bindControls() {
  const on = (id, ev, fn) => { const e = $('#' + id); if (e) e.addEventListener(ev, fn); };
  on('prev', 'click', () => step(-1)); on('next', 'click', () => step(1)); on('play', 'click', togglePlay);
  document.querySelectorAll('#pseg button').forEach(b => b.addEventListener('click', () => { S.primer.p = +b.dataset.p; render(); }));
  on('nW', 'change', e => { S.naive.W = +e.target.value; S.naive.k = Math.min(S.naive.k, S.naive.W - 1); buildControls(); render(); });
  on('nBd', 'change', e => { S.naive.bd = +e.target.value; S.naive.warp = 0; buildControls(); render(); });
  on('nWarp', 'change', e => { S.naive.warp = +e.target.value; render(); });
  on('nK', 'input', e => { S.naive.k = +e.target.value; render(); });
  on('tW', 'change', e => { S.tiled.W = +e.target.value; S.tiled.s = 0; buildControls(); render(); });
  on('tT', 'change', e => { S.tiled.T = +e.target.value; S.tiled.s = 0; S.tiled.warp = 0; buildControls(); render(); });
  on('tWarp', 'change', e => { S.tiled.warp = +e.target.value; render(); });
  on('tS', 'input', e => { S.tiled.s = +e.target.value; render(); });
  on('sExpr', 'input', e => { S.sand.expr = e.target.value; render(); });
  on('sW', 'change', e => { S.sand.W = Math.max(1, Math.min(4096, +e.target.value || 1)); S.sand.k = Math.min(S.sand.k, S.sand.W - 1); buildControls(); render(); });
  on('sBd', 'change', e => { S.sand.bd = +e.target.value; render(); });
  on('sWarp', 'change', e => { S.sand.warp = Math.max(0, Math.min(31, +e.target.value || 0)); render(); });
  on('sK', 'input', e => { S.sand.k = +e.target.value; render(); });
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { S.sand.expr = b.dataset.expr; $('#sExpr').value = S.sand.expr; render(); }));
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { stopPlay(); switchView(t.dataset.view); }));
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' && e.target.type === 'text') return;
  if (tag === 'select') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && (S.view === 'naive' || S.view === 'tiled')) { e.preventDefault(); stepWarp(e.key === 'ArrowDown' ? 1 : -1); }
  else if (['1', '2', '3', '4'].includes(e.key)) { stopPlay(); switchView(['primer', 'naive', 'tiled', 'sand'][+e.key - 1]); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 80); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
let start = 'primer'; try { const v = localStorage.getItem('coalesce-view'); if (v && VIEWS[v]) start = v; } catch (e) {}
switchView(start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
window.addEventListener('load', render);
requestAnimationFrame(render);
</script>
